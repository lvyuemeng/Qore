[project]
name = "qore-workspace"
version = "0.1.0"
description = "Qore quantitative platform workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.14.13",
    "ty>=0.0.29",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["crates/*"]

[tool.uv.sources]
qore-core = { workspace = true }
qore-data = { workspace = true }
qore-factor = { workspace = true }
qore-intelligence = { workspace = true }
qore-runner = { workspace = true }
qore-backtest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["crates", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "C4", "SIM", "PERF", "RUF"]
ignore = ["E501", "RUF003", "RUF012", "PERF401"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 10
