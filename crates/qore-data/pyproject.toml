[project]
name = "qore-data"
version = "0.1.0"
description = "Data layer for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qore-core",
    "duckdb>=1.0",
    "httpx[http2]>=0.28",
    "polars>=1.0",
    "pyarrow>=17",
    "tenacity>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_data"]
