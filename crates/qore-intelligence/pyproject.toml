[project]
name = "qore-intelligence"
version = "0.1.0"
description = "Intelligence layer for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qore-core",
    "qore-data",
    "qore-factor",
    "jieba>=0.42",
    "joblib>=1.4",
    "lightgbm>=4.6",
    "numpy>=2.0",
    "optuna>=4.7",
    "polars>=1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
nlp = ["torch>=2.2", "transformers>=4.40"]
regime = ["hmmlearn>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_intelligence"]
