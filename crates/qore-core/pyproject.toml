[project]
name = "qore-core"
version = "0.1.0"
description = "Core domain types for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_core"]

[tool.hatch.build]
include = ["src/qore_core/holidays.json"]
