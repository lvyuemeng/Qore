[project]
name = "qore-runner"
version = "0.1.0"
description = "Strategy runner for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qore-core",
    "polars>=1.0",
]

[project.optional-dependencies]
opt = ["cvxpy>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_runner"]
