[project]
name = "qore-factor"
version = "0.1.0"
description = "Factor engine for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qore-data",
    "numpy>=2.0",
    "polars>=1.0",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_factor"]
