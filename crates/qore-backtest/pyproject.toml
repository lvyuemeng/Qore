[project]
name = "qore-backtest"
version = "0.1.0"
description = "Backtesting engine for Qore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qore-core",
    "qore-data",
    "qore-runner",
    "polars>=1.0",
    "quantstats>=0.0.62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qore_backtest"]
